# Copy to secret.local.yaml, fill real values, then:
#   kubectl apply -f k8s/secret.local.yaml
# Do NOT commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: devpulse-secrets
  namespace: devpulse
type: Opaque
stringData:
  GITHUB_ID: "replace_me"
  GITHUB_SECRET: "replace_me"
  NEXTAUTH_SECRET: "replace_me"
  NEXTAUTH_URL: "https://devpulse.example.com"
  MONGODB_URI: "mongodb+srv://user:pass@cluster.mongodb.net/devpulse"
  CRON_SECRET: "replace_me"
  GITHUB_TOKEN: ""
  RESEND_API_KEY: ""
