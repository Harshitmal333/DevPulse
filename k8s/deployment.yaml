apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpulse
  namespace: devpulse
  labels:
    app: devpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devpulse
  template:
    metadata:
      labels:
        app: devpulse
    spec:
      containers:
        - name: web
          # Replace with your ECR image after push, e.g.:
          # 123456789012.dkr.ecr.ap-south-1.amazonaws.com/devpulse:latest
          image: devpulse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: devpulse-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
